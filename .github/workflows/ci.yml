# Integração contínua (plano de início, Etapas 2, 6 e 8).
# Nenhum código entra na main sem passar por: tipos → lint → testes → build → salvaguardas →
# orçamentos de tamanho → bot (B1, B11, B12, B14) → Lighthouse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatação
        run: pnpm format:check
      - name: Testes
        run: pnpm test
      - name: Build do site (com pré-renderização)
        run: pnpm build
      - name: Salvaguarda 1 — sem ganchos de teste no build de produção
        run: |
          if grep -rq "__APP_TEST__\|/__test__" apps/web/dist; then
            echo "::error::Ganchos de teste encontrados no build de produção"
            exit 1
          fi
      - name: Um HTML por rota (+ 404) e cabeçalhos da Cloudflare
        working-directory: apps/web/dist
        run: |
          grep -q 'data-prerendered="/"' index.html
          for page in ficha dados apoie creditos termos privacidade 404; do
            test -f "$page.html" || { echo "::error::Falta $page.html no build"; exit 1; }
          done
          test -f _headers
      - name: Orçamentos de tamanho (RNF-01)
        run: pnpm size

  # Etapa 6: bot de testes (plano v2, seção 15). Sobe o build de TESTE (com ganchos e com os
  # mesmos cabeçalhos da produção) e roda B1 (fumaça), B11 (dados), B12 (acessibilidade) e B14.
  bot:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navegador do bot
        run: pnpm --filter @grimorio/qa-bot exec playwright install --with-deps chromium
      - name: Bot — todos os cenários
        run: pnpm bot
      - name: Relatório e traces (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-do-bot
          path: |
            apps/qa-bot/playwright-report
            apps/qa-bot/test-results
          retention-days: 14

  # Etapa 8: Lighthouse com emulação de celular em /dados e na página inicial (RNF-01: LCP ≤ 2,5 s).
  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI
        run: pnpm lighthouse
      - name: Relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-lighthouse
          path: .lighthouseci/relatorios
          retention-days: 14

  # Etapa 9: API com Postgres de verdade (plano v2, 16: testes de integração no CI).
  api:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app -d app_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes de integração (migrações + salvaguardas da API de teste)
        run: pnpm test:api
      - name: Build da API (bundle com os pacotes do workspace)
        run: pnpm build:api
      - name: A API empacotada migra, sobe e responde
        env:
          APP_ENV: test
          DATABASE_URL: postgres://app:app@localhost:5432/app_test
          PORT: 3000
          LOG_LEVEL: warn
        run: |
          node apps/api/dist/db/migrate.js
          node apps/api/dist/server.js &
          curl --silent --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:3000/health
          curl --silent --fail http://localhost:3000/ready
          curl --silent --fail http://localhost:3000/version | grep -q "\"commit\":\"${GITHUB_SHA::7}\""
          # Salvaguarda: sem ENABLE_TEST_API a rota de teste não existe.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://localhost:3000/__test__/reset)" = 404
