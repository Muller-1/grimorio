# Postgres local (plano v2, 17): banco app_dev (desenvolvimento) e app_test (testes).
#   pnpm db:up      sobe e espera ficar pronto
#   pnpm db:down    desliga (os dados continuam no volume)
#   docker compose down -v   apaga TUDO, inclusive os dados
services:
  postgres:
    image: postgres:18-alpine
    container_name: grimorio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_dev
    ports:
      # Só no seu computador (127.0.0.1), não na rede. Porta ocupada? POSTGRES_PORT=5433 pnpm db:up
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A partir do Postgres 18 o volume vai em /var/lib/postgresql (não mais .../data).
      - grimorio-postgres:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante a primeira inicialização o Postgres só ouve o socket local, então o
      # "pronto" só aparece depois que o app_test já foi criado.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U app -d app_test']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  grimorio-postgres:
