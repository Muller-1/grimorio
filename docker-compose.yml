# Postgres local (plano v2, 17): banco app_dev (desenvolvimento) e app_test (testes).
#   pnpm db:up      sobe e espera ficar pronto
#   pnpm db:down    desliga (os dados continuam no volume)
#   docker compose down -v   apaga TUDO, inclusive os dados
services:
  postgres:
    image: postgres:18-alpine
    container_name: grimorio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_dev
    ports:
      # Só no seu computador (127.0.0.1), não na rede. Porta ocupada? POSTGRES_PORT=5433 pnpm db:up
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A partir do Postgres 18 o volume vai em /var/lib/postgresql (não mais .../data).
      - grimorio-postgres:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante a primeira inicialização o Postgres só ouve o socket local, então o
      # "pronto" só aparece depois que o app_test já foi criado.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U app -d app_test']
      interval: 3s
      timeout: 3s
      retries: 20

  # Teste de carga (ADR-016): a API do jeito que roda no Render grátis — a mesma imagem
  # (apps/api/Dockerfile), 0,1 CPU e 512 MB — num banco descartável. Só sobe com o perfil "carga":
  #   pnpm load:up     (cria o banco app_carga_staging se faltar e espera a API)
  #   pnpm load        (o teste)        pnpm load:down   (desliga só esta API)
  # Os segredos daqui só valem no computador; são os padrões do apps/load-test/src/config.ts.
  api-carga:
    profiles: [carga]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: grimorio-api-carga
    container_name: grimorio-api-carga
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.1
    mem_limit: 512m
    environment:
      # staging: igual à produção, mas permite a API de teste (que cria as contas do teste).
      APP_ENV: staging
      PORT: 10000
      # Igual ao render.yaml: em produção cada pedido vai para o log, e isso também gasta CPU.
      LOG_LEVEL: ${CARGA_LOG_LEVEL:-info}
      DATABASE_URL: postgres://app:app@postgres:5432/app_carga_staging
      DATABASE_POOL_MAX: ${CARGA_POOL_MAX:-10}
      SITE_URL: http://localhost:5173
      AUTH_SECRET: segredo-do-teste-de-carga-com-mais-de-32-caracteres
      PROXY_SECRET: segredo-do-repasse-do-teste-de-carga-32c
      ENABLE_TEST_API: 'true'
      TEST_API_TOKEN: token-da-api-de-teste-da-carga-com-32-caracteres
      METRICS_TOKEN: token-das-metricas-da-carga-com-32-caracteres
    ports:
      - '127.0.0.1:${CARGA_PORT:-10000}:10000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:10000/health >/dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  grimorio-postgres:
